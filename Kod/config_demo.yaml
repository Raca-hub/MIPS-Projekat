# DEMO CONFIG - iskljucivo za zivi prikaz treninga na prezentaciji.
# Odvojene putanje od config.yaml, tako da ovo NE dira pravi model
# (models/best_model.pth) treniran na RTX 4060 sa punim datasetom.
#
# Upotreba:
#   python prepare_data.py config_demo.yaml
#   python train.py config_demo.yaml

model:
  architecture: "Unet"
  encoder: "mobilenet_v2"   # najlaksi encoder - brzo se pokrene i na slabijem racunaru
  encoder_weights: "imagenet"
  in_channels: 3
  num_classes: 4

classes:
  0: "nepoznato"
  1: "suma"
  2: "beton"
  3: "polje"

class_colors:
  0: [0, 0, 0]
  1: [0, 255, 0]
  2: [128, 128, 128]
  3: [255, 255, 0]

data:
  tile_size: 256
  tile_overlap: 32
  train_split: 0.8
  seed: 42
  # ODVOJENE putanje od glavnog config.yaml - popuni sa sample_demo_data.py
  raw_images_dir: "data/demo_raw/images"
  raw_masks_dir: "data/demo_raw/masks"
  processed_dir: "data/demo_processed"
  tiles_images_dir: "data/demo_processed/images"
  tiles_masks_dir: "data/demo_processed/masks"

augmentation:
  horizontal_flip: true
  vertical_flip: true
  rotation_limit: 45
  brightness_contrast: true
  random_crop: true

training:
  epochs: 3            # samo par epoha - cilj je da se ZAVRSI za 1-2 minuta uzivo, ne da nauci dobro
  batch_size: 4
  accumulation_steps: 1
  use_amp: true
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_workers: 0
  pin_memory: true
  loss_function: "combo"
  dice_weight: 0.5
  ce_weight: 0.5
  scheduler: "reduce_on_plateau"
  scheduler_patience: 5
  scheduler_factor: 0.5
  min_lr: 0.000001
  early_stopping_patience: 10

paths:
  # ODVOJENO od glavnog models/ foldera - ne pregazuje pravi best_model.pth
  models_dir: "models_demo"
  best_model_pth: "models_demo/demo_model.pth"
  best_model_onnx: "models_demo/demo_model.onnx"
  results_dir: "results_demo"
  logs_dir: "logs_demo"

evaluation:
  iou_threshold: 0.5
  conf_matrix: true

inference:
  device: "auto"
  use_onnx_on_arm: true